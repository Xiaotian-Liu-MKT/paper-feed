name: Auto RSS Fetch

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 这一步非常重要：赋予脚本写入仓库的权限
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run RSS Script
      env: 
        RSS_KEYWORDS: ${{ secrets.RSS_KEYWORDS }}
      run: |
        # SQLite is an ephemeral CI cache. get_RSS.py bootstraps it from the
        # committed XML/JSON compatibility exports when it is absent.
        rm -f data/paper_feed.sqlite3 data/paper_feed.sqlite3-wal data/paper_feed.sqlite3-shm
        python get_RSS.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        if [[ ! -f filtered_feed.xml || ! -f web/feed.json ]]; then
          echo "Publication guard failed: expected both filtered_feed.xml and web/feed.json after RSS generation." >&2
          exit 1
        fi
        python -m paper_feed.publish_guard --xml filtered_feed.xml --json web/feed.json
        if git cat-file -e HEAD:filtered_feed.xml 2>/dev/null; then
          git show HEAD:filtered_feed.xml > "$RUNNER_TEMP/previous_filtered_feed.xml"
          python -m paper_feed.publish_guard --xml filtered_feed.xml --json web/feed.json \
            --baseline-xml "$RUNNER_TEMP/previous_filtered_feed.xml" --projection-limit 1000
        fi
        # Never stage the local SQLite history database.
        files=(filtered_feed.xml web/feed.json)
        for optional_file in web/translations.json web/journals.hash; do
          if [[ -f "$optional_file" ]]; then
            files+=("$optional_file")
          fi
        done
        git add -f -- "${files[@]}"
        if git diff --cached --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        git commit -m "Auto-update RSS feed"
        git push
