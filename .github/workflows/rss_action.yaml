name: Auto RSS Fetch

on:
  schedule:
    - cron: '0 */6 * * *'  # 每6小时运行一次
  workflow_dispatch:      # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 这一步非常重要：赋予脚本写入仓库的权限
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Run tests
      run: python -m unittest discover -s tests -p "test_*.py" -v

    - name: Run RSS Script
      env: 
        RSS_KEYWORDS: ${{ secrets.RSS_KEYWORDS }}
      run: |
        # SQLite is an ephemeral CI cache. get_RSS.py bootstraps it from the
        # committed XML/JSON compatibility exports when it is absent.
        rm -f data/paper_feed.sqlite3 data/paper_feed.sqlite3-wal data/paper_feed.sqlite3-shm
        python get_RSS.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        # Never stage the local SQLite history database.
        git add -f filtered_feed.xml web/feed.json web/translations.json web/journals.hash
        # 只有当有新文件生成或文件变动时才提交
        git commit -m "Auto-update RSS feed" || echo "No changes to commit"
        git push
